name: Update refs

# Pins modules.json's component refs to release tags and commits the result to the branch this
# workflow was run against.
#
# Only the modules you give a version for are touched — leave an input blank to leave that
# module's ref exactly as it is. Nothing is auto-scanned.
#
# This only updates modules.json; it does not build or publish anything. Run "Publish" instead
# to do both in one go.
on:
  workflow_dispatch:
    inputs: &module-inputs
      gendoc_branch:
        description: 'Branch of GenerateDocs to update (blank: "main" if called from another
          repo, else the branch this workflow was triggered from)'
        required: false
        type: string
      oasislmf:
        description: 'New ref for oasislmf (OasisLMF) — blank to leave unchanged'
        required: false
        type: string
      platform:
        description: 'New ref for platform (OasisPlatform) — blank to leave unchanged'
        required: false
        type: string
      ods-tools:
        description: 'New ref for ods-tools (ODS_Tools) — blank to leave unchanged'
        required: false
        type: string
      oed:
        description: 'New ref for oed (ODS_OpenExposureData) — blank to leave unchanged'
        required: false
        type: string
      ord:
        description: 'New ref for ord (ODS_OpenResultsData) — blank to leave unchanged'
        required: false
        type: string
      models:
        description: 'New ref for models (OasisModels) — blank to leave unchanged'
        required: false
        type: string
  workflow_call:
    inputs: *module-inputs
    outputs:
      changed:
        description: 'Whether modules.json was modified'
        value: ${{ jobs.update-refs.outputs.changed }}
      sha:
        description: 'SHA of the commit that pinned the refs (empty if nothing changed)'
        value: ${{ jobs.update-refs.outputs.sha }}

permissions:
  contents: write

jobs:
  update-refs:
    # github.ref_name is the CALLER's ref when this runs as a reusable workflow invoked from
    # another repo (e.g. platform_oasis), so it's only a valid GenerateDocs branch when this
    # repo is the one actually running (no gendoc_branch override needed in that case).
    concurrency: update-refs-${{ inputs.gendoc_branch || (github.repository == 'OasisLMF/GenerateDocs' && github.ref_name) || 'main' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve GenerateDocs branch
        id: repo
        run: |
          if [ -n "${{ inputs.gendoc_branch }}" ]; then
            BRANCH="${{ inputs.gendoc_branch }}"
          elif [ "${{ github.repository }}" = "OasisLMF/GenerateDocs" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="main"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout GenerateDocs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OasisLMF/GenerateDocs
          ref: ${{ steps.repo.outputs.branch }}
          # the default GITHUB_TOKEN is scoped to the caller's repo when this runs as a
          # cross-repo reusable workflow, and can't push commits back to GenerateDocs.
          # BUILD_GIT_TOKEN is the caller's own cross-repo PAT (e.g. platform_oasis, which has
          # no BUILD_DEPLOY_TOKEN of its own); BUILD_DEPLOY_TOKEN covers a direct/local run.
          token: ${{ secrets.BUILD_GIT_TOKEN || secrets.BUILD_DEPLOY_TOKEN }}

      - name: Validate refs exist
        env:
          VERSION_OASISLMF: ${{ inputs.oasislmf }}
          VERSION_PLATFORM: ${{ inputs.platform }}
          VERSION_ODS_TOOLS: ${{ inputs['ods-tools'] }}
          VERSION_OED: ${{ inputs.oed }}
          VERSION_ORD: ${{ inputs.ord }}
          VERSION_MODELS: ${{ inputs.models }}
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys

          with open("modules.json") as f:
              data = json.load(f)
          org = data["org"]

          # maps modules.json module name -> the env var carrying its new ref
          version_envs = {
              "oasislmf": "VERSION_OASISLMF",
              "platform": "VERSION_PLATFORM",
              "ods-tools": "VERSION_ODS_TOOLS",
              "oed": "VERSION_OED",
              "ord": "VERSION_ORD",
              "models": "VERSION_MODELS",
          }

          failed = []
          for mod in data["modules"]:
              name = mod["name"]
              new_ref = os.environ.get(version_envs[name], "").strip()
              if not new_ref:
                  continue
              url = f"https://github.com/{org}/{mod['repo']}.git"
              print(f"checking {name}: {url} @ {new_ref}")
              proc = subprocess.run(["git", "ls-remote", "--exit-code", url, new_ref],
                                     capture_output=True, text=True)
              if proc.returncode != 0 or not proc.stdout.strip():
                  failed.append(f"{name}: ref {new_ref!r} not found in {org}/{mod['repo']}")

          if failed:
              for msg in failed:
                  print(f"::error::{msg}")
              sys.exit(1)
          EOF

      - name: Resolve and apply refs
        id: apply
        env:
          VERSION_OASISLMF: ${{ inputs.oasislmf }}
          VERSION_PLATFORM: ${{ inputs.platform }}
          VERSION_ODS_TOOLS: ${{ inputs['ods-tools'] }}
          VERSION_OED: ${{ inputs.oed }}
          VERSION_ORD: ${{ inputs.ord }}
          VERSION_MODELS: ${{ inputs.models }}
        run: |
          python - <<'EOF'
          import json, os

          with open("modules.json") as f:
              data = json.load(f)

          # maps modules.json module name -> the env var carrying its new ref
          version_envs = {
              "oasislmf": "VERSION_OASISLMF",
              "platform": "VERSION_PLATFORM",
              "ods-tools": "VERSION_ODS_TOOLS",
              "oed": "VERSION_OED",
              "ord": "VERSION_ORD",
              "models": "VERSION_MODELS",
          }

          changed = False
          for mod in data["modules"]:
              name = mod["name"]
              new_ref = os.environ.get(version_envs[name], "").strip()
              if not new_ref:
                  continue
              print(f"{name}: {mod['ref']} -> {new_ref}")
              if mod["ref"] != new_ref:
                  mod["ref"] = new_ref
                  changed = True

          with open("modules.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          EOF

      - name: Commit modules.json
        if: steps.apply.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules.json
          git commit -m "chore: update module refs"
          git push origin HEAD:${{ steps.repo.outputs.branch }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
