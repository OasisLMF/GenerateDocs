name: Update refs

# Pins modules.json's component refs to release tags and commits the result to main.
#
# By default every module is set to its own latest published GitHub release (components tag
# independently, so this can — and usually will — land different version strings per module).
# Pass "modules" to override a subset instead, e.g. "oasislmf=2.5.7,ord=3.0.1" — anything not
# listed there is still auto-scanned.
#
# This only updates modules.json; it does not build or publish anything. Run "Publish" instead
# to do both in one go.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Optional overrides as "name=ref,name=ref" (unlisted modules are
          auto-scanned for their latest release)'
        required: false
        type: string
  workflow_call:
    inputs:
      modules:
        description: 'Optional overrides as "name=ref,name=ref" (unlisted modules are
          auto-scanned for their latest release)'
        required: false
        type: string
    outputs:
      changed:
        description: 'Whether modules.json was modified'
        value: ${{ jobs.update-refs.outputs.changed }}

permissions:
  contents: write

jobs:
  update-refs:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - name: Checkout GenerateDocs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Resolve and apply refs
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDES: ${{ inputs.modules }}
        run: |
          python - <<'EOF'
          import json, os, subprocess

          with open("modules.json") as f:
              data = json.load(f)

          overrides = {}
          raw = os.environ.get("OVERRIDES", "").strip()
          if raw:
              for pair in raw.split(","):
                  pair = pair.strip()
                  if not pair:
                      continue
                  name, ref = pair.split("=", 1)
                  overrides[name.strip()] = ref.strip()

          org = data["org"]
          changed = False
          for mod in data["modules"]:
              name, repo = mod["name"], mod["repo"]
              if name in overrides:
                  new_ref = overrides.pop(name)
                  print(f"{name}: pinned to {new_ref} (override)")
              else:
                  new_ref = subprocess.run(
                      ["gh", "api", f"repos/{org}/{repo}/releases/latest", "--jq", ".tag_name"],
                      check=True, capture_output=True, text=True,
                  ).stdout.strip()
                  print(f"{name}: latest release is {new_ref}")
              if mod["ref"] != new_ref:
                  mod["ref"] = new_ref
                  changed = True

          if overrides:
              raise SystemExit(f"unknown module(s) in overrides: {', '.join(overrides)}")

          with open("modules.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          EOF

      - name: Commit modules.json
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules.json
          git commit -m "chore: update module refs"
          git push origin HEAD:main
