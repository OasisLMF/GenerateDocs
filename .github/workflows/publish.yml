name: Publish

# One-click release: pins modules.json to release tags (via "Update refs"), then builds and
# deploys the versioned site (via "Build and Deploy (versioned)") from the resulting commit.
#
# Run this instead of running "Update refs" and "Build and Deploy" separately when you just
# want to publish. Use them separately if you want to review the resolved refs before deploying.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs: &publish-inputs
      version:
        description: 'Version label to publish (e.g. 2.5.7)'
        required: true
        type: string
      gendoc_branch:
        description: 'Branch of GenerateDocs to publish from (blank: "main" if called from
          another repo, else the branch this workflow was triggered from)'
        required: false
        type: string
      set_latest:
        description: 'Point the site root at this version'
        type: boolean
        default: true
      pages_branch:
        description: 'Branch of the Pages repo to publish to (blank defaults to "gh-pages")'
        required: false
        type: string
      oasislmf:
        description: 'New ref for oasislmf (OasisLMF) — blank to leave unchanged'
        required: false
        type: string
      platform:
        description: 'New ref for platform (OasisPlatform) — blank to leave unchanged'
        required: false
        type: string
      ods-tools:
        description: 'New ref for ods-tools (ODS_Tools) — blank to leave unchanged'
        required: false
        type: string
      oed:
        description: 'New ref for oed (ODS_OpenExposureData) — blank to leave unchanged'
        required: false
        type: string
      ord:
        description: 'New ref for ord (ODS_OpenResultsData) — blank to leave unchanged'
        required: false
        type: string
      models:
        description: 'New ref for models (OasisModels) — blank to leave unchanged'
        required: false
        type: string
  workflow_call:
    inputs: *publish-inputs

jobs:
  update-refs:
    uses: ./.github/workflows/update-refs.yml
    with:
      gendoc_branch: ${{ inputs.gendoc_branch }}
      oasislmf: ${{ inputs.oasislmf }}
      platform: ${{ inputs.platform }}
      ods-tools: ${{ inputs['ods-tools'] }}
      oed: ${{ inputs.oed }}
      ord: ${{ inputs.ord }}
      models: ${{ inputs.models }}
    secrets: inherit

  deploy:
    needs: update-refs
    uses: ./.github/workflows/build-deploy.yml
    with:
      version: ${{ inputs.version }}
      set_latest: ${{ inputs.set_latest }}
      # pick up the exact commit "update refs" just pushed (empty when it made no changes,
      # in which case build-deploy falls back to resolving gendoc_branch itself)
      ref: ${{ needs.update-refs.outputs.sha }}
      gendoc_branch: ${{ inputs.gendoc_branch }}
      pages_branch: ${{ inputs.pages_branch }}
    secrets: inherit

  rollback:
    # deploy failed (or never got a chance to run, e.g. a cancelled job) after update-refs
    # actually committed a ref change — undo exactly that commit so a bad publish never leaves
    # modules.json pinned to a ref nothing was built from.
    needs: [update-refs, deploy]
    if: always() && needs.update-refs.outputs.changed == 'true' && needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve GenerateDocs branch
        id: repo
        run: |
          if [ -n "${{ inputs.gendoc_branch }}" ]; then
            BRANCH="${{ inputs.gendoc_branch }}"
          elif [ "${{ github.repository }}" = "OasisLMF/GenerateDocs" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="main"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout GenerateDocs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: OasisLMF/GenerateDocs
          ref: ${{ steps.repo.outputs.branch }}
          fetch-depth: 0
          # the default GITHUB_TOKEN is scoped to the caller's repo when this runs as a
          # cross-repo reusable workflow, and can't push commits back to GenerateDocs.
          # BUILD_GIT_TOKEN is the caller's own cross-repo PAT (e.g. platform_oasis, which has
          # no BUILD_DEPLOY_TOKEN of its own); BUILD_DEPLOY_TOKEN covers a direct/local run.
          token: ${{ secrets.BUILD_GIT_TOKEN || secrets.BUILD_DEPLOY_TOKEN }}

      - name: Revert the ref-pinning commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-edit ${{ needs.update-refs.outputs.sha }}
          git push origin HEAD:${{ steps.repo.outputs.branch }}
