name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}


jobs:
  deploy-preview:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout v6 moved its credentials out of .git/config into a separate file, so the
          # `git config --unset-all http.…extraheader` that pr-preview-action runs no longer
          # clears them. Requests to github.com then keep this workflow's GITHUB_TOKEN, which
          # cannot see the private PreviewDocs repository, and the deploy fails with
          # "Repository not found". Nothing after this step needs the credentials — build.sh
          # only clones public repos, and the deploy carries its own token.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Build
        run: ./build.sh

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1.8.1
        with:
          source-dir: ./build/html
          deploy-repository: OasisLMF/PreviewDocs
          token: ${{ secrets.BUILD_PREVIEW_TOKEN }}
