name: Build and Deploy (versioned)

# Publishes a versioned build of the aggregated Oasis documentation to
# OasisLMF/OasisLMF.github.io. A publish is an intentional act (a release), so this runs on a
# GitHub release, or on demand via the Actions "Run workflow" button.
#
# Versions accumulate: the job restores the currently-published site, assembles the new version
# into it (orchestrate.py --deploy-version), which regenerates versions.json + the root redirect
# and refreshes the sidebar version selector across every version, then deploys the whole tree.
#
# Before publishing version X, pin the component refs in modules.json to X's tags and commit —
# the build clones each component at those refs. (The "publish" workflow does this for you by
# running "update refs" first, then calling this workflow with the resulting commit.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label to publish (e.g. 2.5.7, or "latest")'
        required: true
      set_latest:
        description: 'Point the site root at this version'
        type: boolean
        default: true
      gendoc_branch:
        description: 'Branch of GenerateDocs to build (blank: "main" if called from another
          repo, else the branch this workflow was triggered from)'
        required: false
        type: string
      pages_branch:
        description: 'Branch of the Pages repo to publish to (blank defaults to "gh-pages")'
        required: false
        type: string
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: 'Version label to publish (e.g. 2.5.7, or "latest")'
        required: true
        type: string
      set_latest:
        description: 'Point the site root at this version'
        type: boolean
        default: true
      ref:
        description: 'Exact commit to build from — used by "publish" to pick up the commit
          "update refs" just pushed, overriding gendoc_branch'
        required: false
        type: string
      gendoc_branch:
        description: 'Branch of GenerateDocs to build (blank: "main" if called from another
          repo, else the branch this workflow was triggered from) — ignored if ref is set'
        required: false
        type: string
      pages_branch:
        description: 'Branch of the Pages repo to publish to (blank defaults to "gh-pages")'
        required: false
        type: string

permissions:
  contents: write

# the published branch of the org Pages repo (GitHub Pages must be configured to serve it)
env:
  PAGES_REPO: OasisLMF/OasisLMF.github.io

jobs:
  build-and-deploy:
    concurrency: ci-deploy          # serialise deploys so accumulation stays consistent
    runs-on: ubuntu-latest
    steps:
      - name: Resolve GenerateDocs branch
        id: repo
        run: |
          if [ -n "${{ inputs.gendoc_branch }}" ]; then
            BRANCH="${{ inputs.gendoc_branch }}"
          elif [ "${{ github.repository }}" = "OasisLMF/GenerateDocs" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="main"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout GenerateDocs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OasisLMF/GenerateDocs
          # explicit ref (set by "publish", the commit "update refs" just pushed) overrides
          # the resolved branch tip
          ref: ${{ inputs.ref || steps.repo.outputs.branch }}

      - name: Resolve version + latest
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            # a normal (non-prerelease) release becomes the site's latest
            echo "latest=${{ !github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "latest=${{ inputs.set_latest }}" >> "$GITHUB_OUTPUT"
          fi
          echo "pages_branch=${{ inputs.pages_branch || 'gh-pages' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Restore the currently-published site (so versions accumulate)
        # Clone gh-pages straight into build/html and keep its .git — the Deploy step below
        # then commits the new version on top of this real history and does a fast-forward
        # push, rather than force-pushing an unrelated tree.
        env:
          PAGES_BRANCH: ${{ steps.v.outputs.pages_branch }}
          # BUILD_GIT_TOKEN is the caller's own cross-repo PAT (e.g. platform_oasis, which has
          # no BUILD_DEPLOY_TOKEN of its own); BUILD_DEPLOY_TOKEN covers a direct/local run.
          PAGES_TOKEN: ${{ secrets.BUILD_GIT_TOKEN || secrets.BUILD_DEPLOY_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git"
          if git clone --depth 1 --branch "$PAGES_BRANCH" "$REMOTE" build/html 2>/dev/null; then
            echo "restored existing site ($(find build/html -maxdepth 1 -mindepth 1 -type d | wc -l) version dirs)"
          else
            mkdir -p build/html
            git -C build/html init -q -b "$PAGES_BRANCH"
            git -C build/html remote add origin "$REMOTE"
            echo "no existing published site on ${PAGES_BRANCH} — first deploy"
          fi
          git -C build/html config user.name "github-actions[bot]"
          git -C build/html config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build this version (accumulating into build/html)
        run: |
          LATEST_FLAG=""
          [ "${{ steps.v.outputs.latest }}" = "true" ] && LATEST_FLAG="--latest"
          python orchestrate.py --clone --keep-going \
            --deploy-version "${{ steps.v.outputs.version }}" $LATEST_FLAG

      - name: Deploy the full versioned site
        # Commits the built tree on top of the clone from the Restore step and fast-forward
        # pushes it — fails if the branch moved since the clone, rather than overwriting it.
        run: |
          cd build/html
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — skipping deploy"
          else
            git commit -q -m "Deploy ${{ steps.v.outputs.version }}"
            git push origin "HEAD:${{ steps.v.outputs.pages_branch }}"
          fi
