name: Link check

# Link rot is a maintenance chore, not a merge gate, so this is NOT a PR check: a weekly
# sweep plus a button. Making it block merges would mean 100+ third-party requests per PR
# and a red build whenever someone else's site is rate-limiting or down, which teaches
# people to ignore it.
#
# It checks the ASSEMBLED site, which is the only place cross-component links exist in
# their final page-relative form. Sphinx's own linkcheck builder runs per project against
# source and cannot see them.
on:
  schedule:
    - cron: '17 6 * * 1'          # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      fail_on_external:
        description: 'Fail the run when an external link is dead (internal breakage always fails)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # nothing here pushes; build.sh clones public repos only

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # the components are pinned in modules.json, so this checks what would be published
      - name: Build the aggregated site
        run: ./build.sh

      - name: Check links
        run: |
          python check_links.py --site build/html \
            --summary "$GITHUB_STEP_SUMMARY" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.fail_on_external) && '--fail-on-external' || '' }}
