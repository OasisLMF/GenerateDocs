version: 2
updates:
  # Actions are pinned to commit SHAs rather than floating major tags, so the code CI runs is
  # fixed by this repository instead of by wherever someone last moved that tag. Dependabot is
  # the other half of that: it turns each upstream release into a reviewable pull request,
  # instead of the update arriving silently between two runs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The docs toolchain. requirements.txt is generated by pip-compile from requirements.in and
  # carries the pip-compile header, so Dependabot regenerates it with pip-compile rather than
  # hand-editing pinned lines.
  #
  # Grouped into a single weekly pull request: almost everything alerted here is transitive
  # (only requests and jinja2 are direct entries in requirements.in), so a bump means a
  # recompile, and one recompile per week is easier to review than a PR per package. It also
  # prevents the drift this file already suffered — before the restructure recompiled it, the
  # pinned set was two years stale and carried a critical h11 advisory plus 13 mistune ones.
  #
  # Nothing here ships to users: this repository only builds documentation, so these updates
  # are hygiene for the CI runner rather than a supply-chain path into a release.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      docs-toolchain:
        patterns: ["*"]
